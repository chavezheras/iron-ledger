<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#393D7E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="new_icon.png">
<link rel="manifest" href="manifest.json">
<title>Iron Ledger — Pelagio &amp; Wanix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1b1b1a; --surface: #242422; --surface-2: #2c2c2a; --line: #3a3936;
    --text: #edeae2; --text-muted: #948f86; --text-dim: #6b6862;
    --accent-pelagio: #393D7E; --accent-pelagio-dim: #393D7E66;
    --accent-wanix: #F05A7E; --accent-wanix-dim: #F05A7E66;
    --good: #7ed6bd; --warn: #ffc857; --radius: 10px;
    --font-display: 'Bebas Neue', sans-serif; --font-body: 'Inter', system-ui, sans-serif; --font-mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #app{ max-width:520px; margin:0 auto; padding:18px 16px 60px; }

  header{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand svg{ width:30px; height:30px; flex-shrink:0; }
  .brand h1{ font-family:var(--font-display); font-size:30px; letter-spacing:1px; margin:0; line-height:1; }
  .brand small{ display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-muted); letter-spacing:1.5px; margin-top:3px; }

  .profile-toggle{ display:flex; background:var(--surface); border-radius:999px; padding:3px; gap:2px; border:1px solid var(--line); }
  .profile-toggle button{ border:none; background:transparent; color:var(--text-muted); font-weight:600; font-size:14px; padding:9px 13px; border-radius:999px; cursor:pointer; transition:background .15s,color .15s; }
  .profile-toggle button.active-pelagio{ background:var(--accent-pelagio); color:var(--text); }
  .profile-toggle button.active-wanix{ background:var(--accent-wanix); color:#171827; }

  .status-line{ font-family:var(--font-mono); font-size:12px; line-height:1.45; color:var(--text-muted); margin:0 0 14px; min-height:17px; }
  .status-line.warn{ color:var(--warn); }
  .status-line.good{ color:var(--good); }

  .tabs{ display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--line); }
  .tabs button{ flex:1; background:none; border:none; color:var(--text-muted); font-weight:600; font-size:15px; padding:12px 4px; cursor:pointer; border-bottom:2px solid transparent; letter-spacing:.3px; }
  .tabs button.active{ color:var(--text); border-bottom-color:var(--current-accent, var(--accent-pelagio)); }

  .day-header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .day-header .date-field{ background:var(--surface); border:1px solid var(--line); color:var(--text); font-family:var(--font-mono); font-size:14px; padding:9px 8px; border-radius:6px; }
  .session-count{ font-family:var(--font-mono); font-size:12px; line-height:1.5; color:var(--text-muted); text-align:right; }

  .group-label{ font-family:var(--font-mono); font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-muted); margin:22px 0 9px; display:flex; align-items:center; gap:8px; }
  .group-label > span{ display:flex; align-items:center; gap:8px; min-width:0; }
  .group-label::after{ content:''; flex:1; height:1px; background:var(--line); }
  .rest-btn{ border:1px solid var(--line); background:var(--surface); color:var(--text); font-family:var(--font-mono); font-size:11px; letter-spacing:0; padding:7px 8px; border-radius:6px; white-space:nowrap; cursor:pointer; }
  .rest-btn:disabled{ color:var(--good); border-color:var(--good); cursor:default; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 14px 12px; margin-bottom:10px; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:2px; }
  .ex-name{ font-weight:700; font-size:18px; line-height:1.2; }
  .ex-cue{ font-size:14px; line-height:1.4; color:var(--text-muted); margin-top:4px; }
  .ex-target{ font-family:var(--font-mono); font-size:12px; line-height:1.4; color:var(--text-muted); margin-top:6px; }
  .swap-tag{ font-size:10px; font-family:var(--font-mono); padding:3px 7px; border-radius:5px; white-space:nowrap; flex-shrink:0; }
  .last-time{ font-family:var(--font-mono); font-size:12px; color:var(--text-muted); margin:10px 0; }
  .badge{ font-size:10px; font-weight:600; padding:2px 7px; border-radius:5px; margin-left:6px; display:inline-block; }
  .badge.good{ background:var(--good); color:#1b1b1a; }
  .badge.warn{ background:var(--warn); color:#1b1b1a; }
  .badge.neutral{ background:var(--surface-2); color:var(--text-muted); }

  .input-row{ display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .weight-wrap{ display:flex; align-items:center; gap:6px; }
  .weight-badge{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:600; font-size:12px; color:#1b1b1a; flex-shrink:0; border:2px solid rgba(0,0,0,.15); }
  input[type="number"], input[type="date"]{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-family:var(--font-mono); font-size:14px; padding:8px 6px; border-radius:6px; width:54px; text-align:center; }
  .weight-input{ width:64px !important; }
  .reps-group{ display:flex; gap:6px; flex-wrap:wrap; }
  .set-col{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .set-col label{ font-size:10px; line-height:1.2; color:var(--text-muted); font-family:var(--font-mono); }

  .save-bar{ position:sticky; bottom:0; padding:14px 0 6px; margin-top:10px; background:linear-gradient(to top, var(--bg) 60%, transparent); }
  .save-btn{ width:100%; border:none; border-radius:999px; padding:16px; font-weight:700; font-size:17px; cursor:pointer; color:var(--text); letter-spacing:.3px; }
  .save-btn:disabled{ opacity:.65; cursor:wait; }
  .clear-link{ display:block; text-align:center; margin-top:20px; color:var(--text-muted); font-size:13px; background:none; border:none; cursor:pointer; font-family:var(--font-body); }

  .hist-controls{ display:flex; gap:8px; margin-bottom:14px; }
  select{ flex:1; background:var(--surface); border:1px solid var(--line); color:var(--text); font-size:16px; padding:11px 10px; border-radius:8px; }
  .chart-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:14px; }
  .chart-empty{ color:var(--text-muted); font-size:14px; line-height:1.45; text-align:center; padding:30px 0; }
  .log-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .log-row:last-child{ border-bottom:none; }
  .log-date{ font-family:var(--font-mono); color:var(--text-muted); font-size:13px; }
  .log-reps{ font-family:var(--font-mono); color:var(--text-muted); font-size:13px; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:20; max-width:90vw; text-align:center; }
  .toast.good{ border-color:var(--good); color:var(--good); }
  .toast.warn{ border-color:var(--warn); color:var(--warn); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  @media (max-width:380px){ .weight-input{ width:58px !important; } input[type="number"]{ width:48px; font-size:15px; } .ex-name{ font-size:17px; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW registration failed', e));
    });
  }
</script>
</body>
</html>
