<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#393D7E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="new_icon.png">
<link rel="manifest" href="manifest.json">
<title>Iron Ledger — Pelagio &amp; Wanix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1b1b1a; --surface: #242422; --surface-2: #2c2c2a; --line: #3a3936;
    --text: #edeae2; --text-muted: #948f86; --text-dim: #6b6862;
    --accent-pelagio: #393D7E; --accent-pelagio-dim: #393D7E66;
    --accent-wanix: #F05A7E; --accent-wanix-dim: #F05A7E66;
    --good: #7ed6bd; --warn: #ffc857; --radius: 10px;
    --font-display: 'Bebas Neue', sans-serif; --font-body: 'Inter', system-ui, sans-serif; --font-mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #app{ max-width:520px; margin:0 auto; padding:18px 16px 60px; }

  header{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand svg{ width:30px; height:30px; flex-shrink:0; }
  .brand h1{ font-family:var(--font-display); font-size:30px; letter-spacing:1px; margin:0; line-height:1; white-space:nowrap; }
  .brand small{ display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-muted); letter-spacing:1.5px; margin-top:3px; }
  .brand.compact h1{ font-size:21px; }
  .brand.compact small{ display:none; }
  .brand.compact svg{ width:24px; height:24px; }


  [hidden]{ display:none !important; }

  .banner-right{ display:flex; align-items:center; gap:8px; }
  .banner-back{ border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:18px; line-height:1; width:38px; height:38px; border-radius:8px; cursor:pointer; }
  .banner-profile{ font-weight:700; font-size:13px; padding:8px 12px; border-radius:999px; letter-spacing:.3px; }
  .sign-out-btn{ border:1px solid var(--line); background:transparent; color:var(--text-muted); font-size:12px; padding:9px 10px; border-radius:8px; cursor:pointer; }

  .status-line{ font-family:var(--font-mono); font-size:12px; line-height:1.45; color:var(--text-muted); margin:8px 0 14px; }
  .status-line.warn{ color:var(--warn); }
  .status-line.good{ color:var(--good); }

  /* ---- Welcome (page 0) ---- */
  .welcome{ margin-top:16px; }
  .welcome-title{ font-family:var(--font-display); font-size:32px; letter-spacing:1px; margin:0 0 18px; }
  .welcome-field{ display:block; margin-bottom:18px; }
  .welcome-field > span{ display:block; font-family:var(--font-mono); font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px; }
  .welcome-field .date-field{ width:100%; text-align:left; font-size:18px; padding:14px 12px; }
  .big-switch{ display:flex; gap:8px; margin-bottom:18px; }
  .big-switch button{ flex:1; border:2px solid var(--line); background:var(--surface); color:var(--text-muted); font-weight:700; font-size:18px; padding:18px 8px; border-radius:12px; cursor:pointer; }
  .big-switch button.on.pelagio{ border-color:var(--accent-pelagio); background:var(--accent-pelagio); color:#fff; }
  .big-switch button.on.wanix{ border-color:var(--accent-wanix); background:var(--accent-wanix); color:#171827; }
  .welcome-card{ background:var(--surface); border:1px solid var(--line); border-left-width:4px; border-radius:var(--radius); padding:16px; margin-bottom:22px; }
  .welcome-card h3{ font-family:var(--font-display); font-size:24px; letter-spacing:.5px; margin:0 0 8px; }
  .welcome-stat{ margin:4px 0; font-size:15px; }
  .welcome-stat b{ font-weight:700; }
  .muted{ color:var(--text-muted); }
  .small{ font-size:13px; line-height:1.5; }

  /* ---- Wizard pages ---- */
  .wizard-page{ margin-top:10px; }
  .page-progress{ font-family:var(--font-mono); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-dim); margin:4px 0 6px; }
  .wizard-foot{ position:sticky; bottom:0; padding:14px 0 8px; margin-top:16px; background:linear-gradient(to top, var(--bg) 68%, transparent); }
  .wizard-btn{ width:100%; border:none; border-radius:14px; padding:20px 16px; font-weight:800; font-size:20px; letter-spacing:.4px; color:#fff; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .wizard-btn small{ font-weight:500; font-size:12px; letter-spacing:.3px; opacity:.85; }
  .wizard-btn.ghost{ background:var(--surface); border:2px solid var(--line); color:var(--text); }
  .finisher-timer{ text-align:center; margin:18px 0 6px; }
  .finisher-timer .wizard-btn{ margin-bottom:8px; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 14px 12px; margin-bottom:10px; }
  .group-label{ font-family:var(--font-mono); font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-muted); margin:6px 0 12px; display:flex; align-items:center; gap:8px; }
  .group-label > span{ display:flex; align-items:center; gap:8px; min-width:0; }
  .group-label::after{ content:''; flex:1; height:1px; background:var(--line); }
  .auth-panel{ max-width:360px; margin:15vh auto 0; padding:28px 22px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); text-align:center; }
  .auth-panel h1{ font-family:var(--font-display); font-size:34px; margin:0 0 10px; }
  .auth-panel p{ color:var(--text-muted); font-size:16px; line-height:1.5; }
  .auth-btn{ width:100%; border:0; border-radius:8px; padding:14px; background:var(--accent-pelagio); color:var(--text); font-size:16px; font-weight:700; cursor:pointer; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:2px; }
  .ex-name{ font-weight:700; font-size:18px; line-height:1.2; }
  .ex-cue{ font-size:14px; line-height:1.4; color:var(--text-muted); margin-top:4px; }
  .ex-target{ font-family:var(--font-mono); font-size:12px; line-height:1.4; color:var(--text-muted); margin-top:6px; }
  .swap-tag{ font-size:10px; font-family:var(--font-mono); padding:3px 7px; border-radius:5px; white-space:nowrap; flex-shrink:0; }
  .last-time{ font-family:var(--font-mono); font-size:12px; color:var(--text-muted); margin:10px 0; }
  .badge{ font-size:10px; font-weight:600; padding:2px 7px; border-radius:5px; margin-left:6px; display:inline-block; }
  .badge.good{ background:var(--good); color:#1b1b1a; }
  .badge.warn{ background:var(--warn); color:#1b1b1a; }
  .badge.neutral{ background:var(--surface-2); color:var(--text-muted); }

  .input-row{ display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .weight-wrap{ display:flex; align-items:center; gap:6px; }
  .weight-badge{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:600; font-size:12px; color:#1b1b1a; flex-shrink:0; border:2px solid rgba(0,0,0,.15); }
  input[type="number"], input[type="date"]{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-family:var(--font-mono); font-size:14px; padding:8px 6px; border-radius:6px; width:54px; text-align:center; }
  .weight-input{ width:64px !important; }
  .reps-group{ display:flex; gap:6px; flex-wrap:wrap; }
  .set-col{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .set-col label{ font-size:10px; line-height:1.2; color:var(--text-muted); font-family:var(--font-mono); }

  .clear-link{ display:block; text-align:center; margin-top:22px; color:var(--text-muted); font-size:13px; background:none; border:none; cursor:pointer; font-family:var(--font-body); }

  /* ---- Save button + result legend ---- */
  .save-btn{ position:relative; overflow:hidden; width:100%; border:none; border-radius:14px; padding:22px 16px; font-weight:800; font-size:21px; letter-spacing:.6px; cursor:pointer; color:#fff; }
  .save-btn:disabled{ cursor:wait; }
  .save-btn.saving::after{ content:''; position:absolute; left:0; top:0; bottom:0; width:0; background:rgba(255,255,255,.28); animation:savefill 1.6s linear forwards; }
  @keyframes savefill{ to{ width:100%; } }

  .save-result{ margin-top:16px; padding:22px 18px; border-radius:14px; text-align:center; font-family:var(--font-display); font-size:30px; letter-spacing:1px; line-height:1.1; }
  .save-result small{ display:block; font-family:var(--font-body); font-size:14px; font-weight:500; letter-spacing:0; line-height:1.5; margin-top:10px; }
  .save-result.saved{ background:#10331e; color:var(--good); border:2px solid var(--good); }
  .save-result.saved small{ color:#bfe9dc; }
  .save-result.local{ background:#3a2f10; color:var(--warn); border:2px solid var(--warn); }
  .save-result.local small{ color:#f0dcae; }
  .save-result.failed{ background:#3c1622; color:var(--accent-wanix); border:2px solid var(--accent-wanix); }
  .save-result.failed small{ color:#f3c2d0; }
  .result-btn{ margin-top:14px; border:2px solid currentColor; background:transparent; color:inherit; font-family:var(--font-body); font-weight:700; font-size:15px; letter-spacing:0; padding:12px 24px; border-radius:999px; cursor:pointer; }

  /* ---- Fullscreen countdown ---- */
  .countdown{ position:fixed; inset:0; z-index:100; background:#0a0a0a; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5vh; text-align:center;
    padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px); }
  .countdown[hidden]{ display:none !important; }
  .countdown-label{ font-family:var(--font-display); font-size:min(12vw,72px); letter-spacing:2px; color:var(--good); }
  .countdown-time{ font-family:var(--font-mono); font-weight:600; font-size:min(26vw,170px); letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums; }
  .countdown-sub{ font-family:var(--font-mono); font-size:15px; letter-spacing:2px; color:#777; min-height:18px; }
  .countdown.warn .countdown-time{ color:var(--warn); }
  .countdown.warn .countdown-label{ color:var(--warn); }
  .countdown-skip{ margin-top:3vh; border:2px solid #fff; background:transparent; color:#fff; font-size:20px; font-weight:800; letter-spacing:.5px; padding:16px 52px; border-radius:999px; cursor:pointer; }
  body.cd-open{ overflow:hidden; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:120; max-width:90vw; text-align:center; }
  .toast.good{ border-color:var(--good); color:var(--good); }
  .toast.warn{ border-color:var(--warn); color:var(--warn); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  @media (max-width:380px){ .weight-input{ width:58px !important; } input[type="number"]{ width:48px; font-size:15px; } .ex-name{ font-size:17px; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<div class="countdown" id="countdown" hidden>
  <div class="countdown-label" id="cdLabel">REST</div>
  <div class="countdown-time" id="cdTime">1:00</div>
  <div class="countdown-sub" id="cdSub"></div>
  <button class="countdown-skip" id="cdSkip" type="button">Skip</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW registration failed', e));
    });
  }
</script>
</body>
</html>
